services:
  moderation:
    extends:
      file: backend/api-mock/docker-compose.yml
      service: moderation-api
    build: ./backend/api-mock
  api:
    build: .
    environment:
      DATABASE_URL: postgres://anuncios:local_dev@postgres:5432/anuncios
      MODERATION_URL: http://moderation:8787
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      moderation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ads?pageSize=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
  postgres-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_DB: anuncios_test
      POSTGRES_USER: anuncios
      POSTGRES_PASSWORD: local_dev
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "anuncios", "-d", "anuncios_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: anuncios
      POSTGRES_USER: anuncios
      POSTGRES_PASSWORD: local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anuncios -d anuncios"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
